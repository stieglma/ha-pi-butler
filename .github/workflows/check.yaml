name: Check Pi Butler
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
      - run: uv sync --project pi_butler --locked --python 3.11
      - run: uv run --project pi_butler --locked python -m unittest discover -s pi_butler/tests -v
        env:
          PYTHONPATH: pi_butler/src
      - run: node --test pi_butler/tests/test_browser_policy.mjs
      - run: uv run --project pi_butler --locked python -m compileall -q pi_butler/src
      - run: uv run --project pi_butler --locked python pi_butler/tests/check_metadata.py
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/amd64 -t pi-butler:test pi_butler
      - run: docker run --rm --entrypoint /bin/bash pi-butler:test -c 'pi --version && pi-web --version && gh --version && glab --version && pi-web-sessiond --check-runtime'
      - run: docker run --rm --entrypoint /opt/venv/bin/python3 -v "$PWD/pi_butler/tests:/tests:ro" pi-butler:test -m unittest discover -s /tests -v
      - run: docker run --rm --user 1000:1000 --entrypoint node -v "$PWD/pi_butler/tests:/tests:ro" pi-butler:test /tests/plugin_smoke.mjs
      - run: docker run --rm --user 1000:1000 --entrypoint node -v "$PWD/pi_butler/tests:/tests:ro" pi-butler:test /tests/marketplace_smoke.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
      - run: uv sync --project pi_butler --locked --python 3.11
      - run: uv run --project pi_butler --locked bash pi_butler/tests/container_smoke.sh
      - if: failure()
        run: docker logs pi-butler-smoke || true
