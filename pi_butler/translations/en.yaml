configuration:
  repository:
    name: Configuration repository
    description: Optional independent Git checkout. Authenticate in the Pi Web terminal. Restart the app after changes.
    fields:
      url:
        name: Repository URL
        description: Leave empty to use Pi Butler without a repository. Use SSH or HTTPS without embedded credentials.
      checkout_branch:
        name: Initial checkout branch
        description: Existing remote branch cloned during first setup. Existing work is never reset or switched automatically.
      author_name:
        name: Git author name
      author_email:
        name: Git author email
      delivery:
        name: Delivery mode
        description: push delivers to the destination branch; pull_request creates a PR or MR against the base branch.
      destination_branch:
        name: Push destination branch
      base_branch:
        name: PR / MR base branch
      work_branch_prefix:
        name: Work branch prefix
      forge:
        name: Git hosting service
  limits:
    name: Resource limits
    description: Operational limits for requests, logs and persistent storage; these do not grant entity access.
    fields:
      parallel_requests:
        name: Concurrent HA requests
      response_bytes:
        name: Maximum response bytes
      log_lines:
        name: Maximum diagnostic log lines
      retention_days:
        name: Diagnostic retention in days
      storage_megabytes:
        name: Persistent storage threshold in MiB
        description: Stops the app on the next periodic check when exceeded. Existing work and sessions are preserved.
