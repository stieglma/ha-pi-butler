configuration:
  knx:
    name: KNX Editor (Beta)
    description: Separater Admin-Editor. Änderungen werden noch nicht automatisch ins Git-Repository gesichert. Nach Änderungen der Optionen die App neu starten.
    fields:
      enabled:
        name: KNX Editor aktivieren
      read_enabled:
        name: KNX-Projekt für den Assistenten lesbar
        description: Nur lesende Projektwerkzeuge. Schreiben, Löschen und Buszugriff bleiben für den Assistenten gesperrt.
      repository_directory:
        name: KNX-Ordner im Repository
        description: Relativ zum konfigurierten Git-Repository, standardmäßig knx_editor. Den Ordner mit KNX-Entitäts-YAMLs nicht von HA-Neustarts ausnehmen. Setup prüft hier die Projektdatei; Editor-Import bleibt manuell.
      project_filename:
        name: KNX-Projektdateiname
        description: Exakter .knxproj-Dateiname mit Endung in diesem Ordner, standardmäßig project.knxproj. Keine Platzhaltersuche und kein automatischer Import.
      gateway_addresses:
        name: Geschützte KNX-Gateway-IP-Adressen
        description: Alle IPv4-/IPv6-Adressen der KNX-Schnittstellen inklusive Alternativadressen eintragen. Vor Aktivierung erforderlich. Nur der KNX-Dienst erreicht diese Adressen auf beliebigen Ports. KNX-Standardports sowie Multicast/Broadcast sind für Agenten ebenfalls gesperrt. Änderungen erfordern einen App-Neustart.
  repository:
    name: Konfigurations-Repository
    description: Optionaler, unabhängiger Git-Checkout. Anmeldung im Pi-Web-Terminal. Nach Änderungen die App neu starten.
    fields:
      url:
        name: Repository-URL
        description: Leer lassen, um Pi Butler ohne Repository zu nutzen. SSH oder HTTPS ohne eingebettete Zugangsdaten verwenden.
      checkout_branch:
        name: Branch für den ersten Checkout
        description: Vorhandener Remote-Branch für die Ersteinrichtung. Bestehende Arbeit wird nicht automatisch zurückgesetzt oder umgeschaltet.
      author_name:
        name: Git-Autorenname
      author_email:
        name: Git-Autoren-E-Mail
      delivery:
        name: Bereitstellungsmodus
        description: push überträgt in den Ziel-Branch; pull_request erstellt einen PR oder MR zum Basis-Branch.
      destination_branch:
        name: Ziel-Branch für Push
      base_branch:
        name: Basis-Branch für PR / MR
      work_branch_prefix:
        name: Präfix für Arbeits-Branches
      forge:
        name: Git-Hosting-Dienst
  limits:
    name: Ressourcenlimits
    description: Betriebsgrenzen für Anfragen, Protokolle und persistenten Speicher. Diese Einstellungen vergeben keine Entitätsrechte.
    fields:
      parallel_requests:
        name: Gleichzeitige HA-Anfragen
      response_bytes:
        name: Maximale Antwortgröße in Bytes
      log_lines:
        name: Maximale Anzahl Diagnosezeilen
      retention_days:
        name: Diagnoseaufbewahrung in Tagen
      storage_megabytes:
        name: Speicherschwelle in MiB
        description: Bei Überschreitung wird die App bei der nächsten regelmäßigen Prüfung angehalten. Bestehende Arbeit und Sitzungen bleiben erhalten.
